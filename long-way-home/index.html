<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2C42">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Long Way">
<meta name="description" content="A virtual cycling expedition: ride your indoor miles along real roads anywhere in the world.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>The Long Way Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="leaflet.css">
<style>
/* Layout idea: one quiet column. The map is the only large object; everything else is type on a neutral ground. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#14181A; --muted:#687076; --line:#E6E7E4;
  --accent:#0E7268; --accent-ink:#FFFFFF; --award:#9A6B1F; --warn:#A4481F;
  --sea:#9FCDEB; --land:#B9D79A; --border:#5E6B55; --road:#E7A34B; --todo:#2F3B45; --route:#E4482A;
  --display:SamsungSharpSans,"Samsung Sharp Sans",Montserrat,"Helvetica Neue",Arial,sans-serif;
  --body:SamsungOne,Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(20,24,26,.05),0 8px 24px rgba(20,24,26,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1D21; --surface:#23272C; --ink:#F4F5F3; --muted:#A3AAB0; --line:#343A40;
  --accent:#43C6B5; --accent-ink:#06211E; --award:#D8A857; --warn:#E58A5E;
  --sea:#123B57; --land:#3F5A37; --border:#9AA894; --road:#B97A2E; --todo:#D9DEE2; --route:#FF6B47;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1A1D21; --surface:#23272C; --ink:#F4F5F3; --muted:#A3AAB0; --line:#343A40;
  --accent:#43C6B5; --accent-ink:#06211E; --award:#D8A857; --warn:#E58A5E;
  --sea:#123B57; --land:#3F5A37; --border:#9AA894; --road:#B97A2E; --todo:#D9DEE2; --route:#FF6B47;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
:root[data-app-theme="light"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#14181A; --muted:#687076; --line:#E6E7E4;
  --accent:#0E7268; --accent-ink:#FFFFFF; --award:#9A6B1F; --warn:#A4481F;
  --sea:#9FCDEB; --land:#B9D79A; --border:#5E6B55; --road:#E7A34B; --todo:#2F3B45; --route:#E4482A;
  --shadow:0 1px 2px rgba(20,24,26,.05),0 8px 24px rgba(20,24,26,.06); color-scheme:light;
}
:root[data-app-theme="dark"]{
  --bg:#1A1D21; --surface:#23272C; --ink:#F4F5F3; --muted:#A3AAB0; --line:#343A40;
  --accent:#43C6B5; --accent-ink:#06211E; --award:#D8A857; --warn:#E58A5E;
  --sea:#123B57; --land:#3F5A37; --border:#9AA894; --road:#B97A2E; --todo:#D9DEE2; --route:#FF6B47;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;padding-top:env(safe-area-inset-top);display:flex;flex-direction:column;position:relative;overflow:hidden;max-width:560px;margin:0 auto}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.view{display:none;padding:20px 20px 96px}
.view.on{display:block}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
.serif{font-family:var(--display);font-weight:700;letter-spacing:-.02em}
h2.serif{font-size:27px;line-height:1.15}
.sub{color:var(--muted);margin:4px 0 0}
.num{font-variant-numeric:tabular-nums}

/* Journey */
.hero{margin:18px 0 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero .big{font-family:var(--display);font-size:54px;line-height:1;font-weight:700;letter-spacing:-.03em}
.hero .unit{font-family:var(--body);font-size:15px;color:var(--muted);margin-left:6px;font-weight:400;letter-spacing:0}
.hero .pct{font-size:20px;font-weight:600;color:var(--accent)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#7CC96B 45%,#F2B53A 75%,var(--route));border-radius:3px;min-width:6px;transition:width .6s ease}
.mapwrap{margin:18px -20px 0;position:relative}
#map{height:320px;background:var(--sea);z-index:0}
.leaflet-container{font:inherit;background:var(--sea)}
.mapctl{position:absolute;left:12px;bottom:12px;z-index:5;display:flex;gap:8px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);min-height:34px}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg.wide{display:flex;box-shadow:none}.seg.wide button{flex:1;white-space:nowrap;padding:7px 6px}
.lbl{white-space:nowrap;font-size:11.5px;font-weight:700;color:var(--ink);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 2px var(--bg);transform:translate(8px,-8px);pointer-events:none}
.lbl.minor,.lbl.place{display:none}
.lbl.place{font-weight:400;color:var(--muted);font-size:10.5px}
.lbl.country{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);opacity:.7;font-weight:500;transform:translate(-50%,-50%);display:none}
.z-mid .lbl.minor,.z-mid .lbl.country,.z-hi .lbl.minor,.z-hi .lbl.place{display:block}
.me{width:18px;height:18px;border-radius:50%;background:var(--route);border:3px solid #fff;box-shadow:0 0 0 1px var(--route),0 2px 8px rgba(0,0,0,.35);position:relative}
.me::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--route);opacity:0;animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:.7}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.me::after{animation:none}.bar i{transition:none}}
.now{padding:20px 0 4px}
.now h3{font-family:var(--display);font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.rows{margin:14px 0 0;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.row .k{color:var(--muted);font-size:15px}
.row .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.row .v small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.trio div{border-top:3px solid transparent;border-image:linear-gradient(90deg,var(--accent),var(--route)) 1;padding-top:8px}
.trio b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.trio span{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:14px 0 0}
.status{flex:none;white-space:nowrap;padding-top:2px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status.ok i{background:var(--accent)}.status.bad i{background:var(--warn)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:12px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;color:var(--ink);text-align:center}
.btn.pri{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#3D9BE0));border-color:transparent;color:var(--accent-ink);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.ghost{background:none}
.btn.sm{min-height:40px;width:auto;padding:8px 14px;font-size:14px}
.btn.danger{color:var(--warn)}
.stack{display:grid;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#fab{position:absolute;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:20;border:0;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#3D9BE0));color:var(--accent-ink);font-weight:600;padding:14px 20px;border-radius:26px;box-shadow:var(--shadow);min-height:50px}

/* Tabs */
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;color:var(--muted);text-decoration:none;font-weight:500;min-height:56px}
nav.tabs a.on{color:var(--accent)}
nav.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* Lists */
.sect{margin-top:30px}
.sect>h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.list{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:14px;width:100%;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600}
.item .t span{display:block;color:var(--muted);font-size:14px}
.item .r{color:var(--muted);font-size:14px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.item.locked .t b{color:var(--muted)}
.dish,.item .t b.dish{font-family:var(--display);font-size:17px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.glyph{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:var(--muted)}
.glyph svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.glyph.done{border-color:var(--accent);color:var(--accent)}

/* Timeline */
.tl{position:relative;margin-top:6px}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl .fill{position:absolute;left:6px;top:8px;width:2px;background:var(--accent)}
.tl .stop{position:relative;padding:0 0 18px 30px}
.tl .stop::before{content:"";position:absolute;left:0;top:4px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--border)}
.tl .stop.done::before{background:var(--accent);border-color:var(--accent)}
.tl .stop b{font-weight:600}
.tl .stop .mi{float:right;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.tl .stop p{margin:1px 0 0;color:var(--muted);font-size:14px}
.tl .award{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.tl .stop.done .award{border-color:var(--award);color:var(--award)}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:18px 10px}
.medal{text-align:center;font-size:13px;color:var(--muted)}
.medal i{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 8px;border-radius:50%;border:1.5px solid var(--line);font-style:normal;font-weight:600;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.medal.done{color:var(--ink)}
.medal.done i{border:2px solid var(--award);color:var(--award);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--award) 22%,transparent),transparent 70%);box-shadow:inset 0 0 0 4px var(--bg),inset 0 0 0 5px var(--award)}

/* Sheet */
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);z-index:40;display:flex;align-items:flex-end}
#scrim[hidden]{display:none}
#sheet{background:var(--bg);box-shadow:0 -8px 30px rgba(0,0,0,.12);width:100%;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom));animation:up .28s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}}
.sheethead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.x{border:0;background:var(--line);width:34px;height:34px;border-radius:50%;flex:none;font-size:18px;line-height:1;color:var(--muted)}
label.f{display:block;margin-top:14px;font-size:14px;color:var(--muted)}
label.f input,label.f textarea,label.f select{display:block;width:100%;margin-top:6px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:17px;min-height:48px;color:var(--ink)}
label.f textarea{min-height:76px;resize:vertical}
.err{color:var(--warn);font-size:14px;margin:8px 0 0}
.prose p{margin:0 0 12px}
.prose h4{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:22px 0 8px}
.prose ul,.prose ol{margin:0;padding-left:20px}
.prose li{margin-bottom:7px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:14px;margin:8px 0 4px}
.arrive{text-align:center;padding:10px 0 4px}
.arrive .ring{width:74px;height:74px;border-radius:50%;margin:0 auto 16px;border:2px solid var(--award);box-shadow:inset 0 0 0 5px var(--bg),inset 0 0 0 6px var(--award);display:grid;place-items:center;color:var(--award);animation:pop .7s ease}
@keyframes pop{from{transform:scale(.6);opacity:0}60%{transform:scale(1.06)}to{transform:none;opacity:1}}
.arrive .ring svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.arrive h2{font-family:var(--display);font-size:29px;font-weight:700;line-height:1.15;letter-spacing:-.02em}
#toast{position:absolute;left:16px;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:50;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:var(--shadow);font-size:15px}
#toast[hidden]{display:none}
#toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:6px}
.weeks{display:flex;align-items:flex-end;gap:6px;height:84px;margin-top:12px;position:relative;border-bottom:1px solid var(--line)}
.weeks .w{flex:1;background:var(--line);border-radius:3px 3px 0 0;min-height:2px}
.weeks .w.hit{background:var(--accent)}
.weeks .target{position:absolute;left:0;right:0;border-top:1px dashed var(--muted);font-size:11px;color:var(--muted)}
.weeks .target span{position:absolute;right:0;top:-16px;background:var(--bg);padding-left:4px}
.prof{width:100%;height:auto;display:block;overflow:visible}
.prof .sl{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.prof .grid{stroke:var(--line);stroke-dasharray:3 4}.prof .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.prof text{font-size:11px;fill:var(--muted);font-family:var(--body);font-variant-numeric:tabular-nums}
.item.blk{align-items:stretch}.item.blk .chip{width:6px;border-radius:3px;flex:none}
.item .t b .cat,.cat{display:inline-block;width:auto;font-size:11px;font-weight:700;letter-spacing:.04em;padding:1px 7px;margin-right:6px;border-radius:10px;background:var(--route);color:#fff !important;vertical-align:1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}.item.blk .t b{font-size:15px}.item.blk .r{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:12px}
.item.blk .r b.res{font-size:19px;color:var(--ink);font-weight:700}
.relief{image-rendering:auto}
#landing{position:fixed;inset:0;z-index:60;background:#0B2C42;overflow:hidden;color:#fff;transition:opacity .45s ease,transform .45s ease}
#landing.out{opacity:0;transform:scale(1.03);pointer-events:none}
#landing[hidden]{display:none}
#land-cv{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .8s ease}
#land-cv.on{opacity:1}
.land-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,18,28,.45) 0%,rgba(6,18,28,.08) 14%,rgba(6,18,28,0) 34%,rgba(6,18,28,.18) 48%,rgba(6,18,28,.55) 58%,rgba(6,18,28,.85) 68%,rgba(6,18,28,.97) 82%,#06121C 100%)}
.land-body{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;padding:0 24px calc(28px + env(safe-area-inset-bottom));display:grid;gap:10px}
.land-body .eyebrow{color:rgba(255,255,255,.75)}
.land-title{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.02;letter-spacing:-.03em;color:#fff;margin:0}
.land-tag{margin:0;font-size:19px;line-height:1.35;max-width:24ch;color:rgba(255,255,255,.82)}
.land-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 12px;border-top:1px solid rgba(255,255,255,.22);padding-top:14px}
.land-stats b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#fff}
.land-stats span{font-size:12.5px;color:rgba(255,255,255,.7)}
.land-now{grid-column:1/-1;font-size:15px;color:rgba(255,255,255,.85)}
#landing .btn.pri{background:linear-gradient(135deg,#FFFFFF,#DDEFFA);border-color:transparent;color:#0B2C42;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#landing .land-ghost{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.35);color:#fff}
@media (prefers-reduced-motion:reduce){#landing,#land-cv{transition:none}}
#ride{position:fixed;inset:0;z-index:70;background:linear-gradient(180deg,#9CC9EA 0%,#CFE5F3 22%,#EEF4F6 34%);overflow:hidden}
:root[data-app-theme="dark"] #ride{background:linear-gradient(180deg,#071522 0%,#12283A 26%,#1D2B36 36%)}
@media (prefers-color-scheme:dark){:root:not([data-app-theme="light"]) #ride{background:linear-gradient(180deg,#071522 0%,#12283A 26%,#1D2B36 36%)}}
#ride[hidden]{display:none}
#rv-stage{position:absolute;left:50%;top:68%;transform-origin:50% 50%;will-change:transform}
#rv-map{position:absolute;inset:0;background:var(--land)}
.rv-lbl{white-space:nowrap;font-size:15px;font-weight:700;color:#14181A;text-shadow:0 0 4px #fff,0 0 4px #fff,0 0 3px #fff;transform:translate(-50%,-50%) rotate(calc(var(--h,0)*1deg));transform-origin:50% 50%}
.rv-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 0%,transparent 24%,transparent 70%,color-mix(in srgb,var(--bg) 85%,transparent) 84%,var(--bg) 100%)}
.rv-me{position:absolute;left:50%;top:68%;width:0;height:0;pointer-events:none}
.rv-me i{position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;background:var(--route);border:4px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.rv-me i::after{content:"";position:absolute;left:50%;top:-15px;transform:translateX(-50%);border:9px solid transparent;border-bottom:13px solid var(--route)}
#rv-top{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));display:grid;grid-template-columns:1fr auto;gap:10px;max-width:640px;margin:0 auto}
.rv-turn{display:flex;align-items:center;gap:12px;background:#12324A;color:#fff;border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);min-width:0}
.rv-turn b{display:block;font-family:var(--display);font-size:22px;line-height:1.1;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-turn span{font-size:14px;opacity:.85}
.rv-arrow{font-size:30px;font-weight:700;line-height:1;display:inline-block;transition:transform .5s}
.rv-res{background:var(--surface);border-radius:18px;padding:10px 14px;box-shadow:var(--shadow);border-left:6px solid;text-align:right;display:flex;flex-direction:column}
.rv-res b{font-size:28px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.rv-res span{font-size:12.5px;color:var(--muted)}
.rv-next{grid-column:1/-1;justify-self:start;background:var(--surface);border-radius:12px;padding:7px 12px;font-size:14px;font-weight:600;box-shadow:var(--shadow)}
.rv-zoom{position:absolute;right:12px;top:42%;display:grid;gap:8px}
.rv-zoom button{width:46px;height:46px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);font-size:24px;color:var(--ink)}
.rv-bottom{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));display:grid;gap:12px;max-width:640px;margin:0 auto}
#rv-stats{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);align-items:center}
#rv-stats b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#rv-stats span{font-size:12.5px;color:var(--muted)}
.rv-speed{display:flex;align-items:center;justify-content:flex-end;gap:8px;text-align:center}
.rv-speed button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:22px;color:var(--ink)}
#rv-go.on{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:none}
body.riding #fab{display:none}
.rv-attr{position:absolute;right:8px;bottom:calc(150px + env(safe-area-inset-bottom));margin:0;font-size:10px;color:var(--muted);background:color-mix(in srgb,var(--bg) 70%,transparent);padding:1px 5px;border-radius:4px}
textarea.dump{width:100%;height:160px;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);color:var(--ink)}
</style>
</head>
<body>
<div id="app">
<main id="main">
  <section class="view on" id="v-journey">
    <div class="head">
      <div>
        <p class="eyebrow" id="j-title">Coventry → Penang</p>
        <p class="sub serif" style="font-size:18px;color:var(--ink)">One ride. One extraordinary journey.</p>
      </div>
      <div class="status" id="status"><i></i><span>Loading</span></div>
    </div>
    <div id="j-hero"></div>
    <div class="mapwrap">
      <div id="map" role="application" aria-label="Route map from Coventry to Penang"></div>
      <div class="mapctl">
        <div class="seg" role="group" aria-label="Map view">
          <button id="m-stage" class="on">Current stage</button>
          <button id="m-all">Whole route</button>
        </div>
      </div>
    </div>
    <button class="btn pri" style="margin-top:16px" data-act="ride">Ride mode: follow the road as you pedal</button>
    <div id="j-body"></div>
  </section>
  <section class="view" id="v-explore"></section>
  <section class="view" id="v-rewards"></section>
  <section class="view" id="v-recipes"></section>
  <section class="view" id="v-profile"></section>
</main>
<button id="fab" data-act="log">Log a ride</button>
<div id="toast" hidden><span></span><button data-act="undo">Undo</button></div>
<nav class="tabs" aria-label="Sections">
  <a href="#journey" data-tab="journey" class="on"><svg viewBox="0 0 24 24"><path d="M4 19c4-1 3-6 7-7s4-6 9-7"/><circle cx="4" cy="19" r="1.6"/><circle cx="20" cy="5" r="1.6"/></svg>Journey</a>
  <a href="#explore" data-tab="explore"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Explore</a>
  <a href="#rewards" data-tab="rewards"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="5.5"/><path d="M8.5 13.5L7 21l5-2.5L17 21l-1.5-7.5"/></svg>Rewards</a>
  <a href="#recipes" data-tab="recipes"><svg viewBox="0 0 24 24"><path d="M7 3v7a2 2 0 002 2v9M5 3v5M9 3v5M17 21v-8c-2 0-3-2-3-5s1.5-5 3-5v10"/></svg>Recipes</a>
  <a href="#profile" data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>Profile</a>
</nav>
<section id="ride" hidden aria-label="Ride mode">
  <div id="rv-stage"><div id="rv-map"></div></div>
  <div class="rv-shade"></div>
  <div class="rv-me" aria-hidden="true"><i></i></div>
  <div id="rv-top" aria-live="polite"></div>
  <p class="rv-attr" id="rv-attr" hidden>© OpenStreetMap contributors © CARTO</p>
  <div class="rv-zoom"><button data-act="rv-in" aria-label="Zoom in">+</button><button data-act="rv-out" aria-label="Zoom out">−</button></div>
  <div class="rv-bottom"><div id="rv-stats"></div><div class="two"><button class="btn pri" id="rv-go" data-act="rv-go">Start riding</button><button class="btn" data-act="rv-end">Finish</button></div></div>
</section>
<section id="landing" aria-label="Welcome">
  <canvas id="land-cv" aria-hidden="true"></canvas>
  <div class="land-shade"></div>
  <div class="land-body">
    <p class="eyebrow">A cycling expedition</p>
    <h1 class="land-title">The Long Way Home</h1>
    <p class="land-tag">The world is out there. Ride it, one mile at a time.</p>
    <div class="stack" style="margin-top:18px">
      <button class="btn pri" data-act="enter">Continue</button>
      <button class="btn land-ghost" data-act="enter-plan">Start a new journey</button>
    </div>
  </div>
</section>
<div id="scrim" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="geo.js"></script>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
