<title>SKYWAR</title>
<style>
/* Layout: one full-bleed canvas; the 480x800 play area is letterboxed inside it. Single dark arcade look. */
:root{--bg:#0a0f16;--fg:#ece4cf;--accent:#e9b44c;--panel:#182230;--line:#3b4a5c;
  --font-ui:"Arial Narrow","Franklin Gothic Medium",Arial,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);overflow:hidden;touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--font-ui)}
#game{display:block;width:100%;height:100%;touch-action:none;outline:none}
#fs{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;
  font:600 13px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;cursor:pointer}
#fs:hover,#fs:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
</style>
<canvas id="game" tabindex="0" aria-label="SKYWAR game"></canvas>
<button id="fs" type="button">Full screen</button>
<script>
'use strict';
/* =====================================================================
   SKYWAR: A CENTURY OF FLIGHT  -  single-file top-down warplane shooter
   Sections: 1 config/utils/input  2 audio  3 sprites  4 era data
             5 game entities  6 rendering  7 UI + main loop
   ===================================================================== */

/* ---------- 1. CONFIG & UTILS ---------- */
const W=480,H=800,TAU=Math.PI*2;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const fsBtn=document.getElementById('fs');
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.random()*a.length|0];
function srand(seed){let s=(seed>>>0)||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const FONT_D='Impact,Haettenschweiler,"Arial Narrow Bold","Franklin Gothic Bold",sans-serif';
const FONT_M='ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace';
const FONT_S='Georgia,"Times New Roman",serif';

/* Simple object pool: dead objects are swapped to the end and reused. */
class Pool{constructor(){this.a=[];this.n=0;}
  add(){if(this.n===this.a.length)this.a.push({});return this.a[this.n++];}
  kill(i){const t=this.a[i];this.a[i]=this.a[--this.n];this.a[this.n]=t;}
  clear(){this.n=0;}}

/* ---------- saved settings & progress ---------- */
const SAVE_KEY='skywar_v1';
function loadSave(){try{return JSON.parse(localStorage.getItem(SAVE_KEY))||{};}catch(e){return {};}}
const save=Object.assign({unlocked:1,best:[0,0,0,0,0,0,0],scores:[],music:.6,sfx:.8,mute:false,diff:1,shake:true,sens:1,done:false},loadSave());
function store(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

/* ---------- canvas scaling (letterboxed 480x800) ---------- */
let scale=1,offX=0,offY=0,DPR=1,VW=1,VH=1;
function resize(){const r=cv.getBoundingClientRect();VW=r.width||1;VH=r.height||1;
  DPR=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
  scale=Math.min(VW/W,VH/H);offX=(VW-W*scale)/2;offY=(VH-H*scale)/2;}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));

/* ---------- toasts ---------- */
const toasts=[];
function toast(msg){toasts.push({msg,t:3});if(toasts.length>3)toasts.shift();}

/* ---------- input: keyboard, gamepad, touch/mouse ---------- */
const keys={};let usedTouch=false,triedFS=false;
const inp={x:0,y:0,fire:false};const tap={};let prevIn={};
const touch={id:null,lx:0,ly:0,dx:0,dy:0,active:false,bomb:false,special:false,pause:false,tapAny:false};
let hot=[],lastP={x:0,y:0};           // clickable menu regions, rebuilt every frame
let state='boot';

function goFull(){const el=document.documentElement,d=document;
  try{if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return;}
    const f=el.requestFullscreen||el.webkitRequestFullscreen;
    if(f){const p=f.call(el);if(p&&p.catch)p.catch(()=>{});}
    else toast('iPhone: Share > Add to Home Screen for full screen');
  }catch(e){}}
fsBtn.addEventListener('click',()=>{firstInput();goFull();cv.focus();});
function firstInput(){Snd.init();
  if(!triedFS){triedFS=true;let top=false;try{top=window.top===window;}catch(e){}
    const el=document.documentElement;if(top&&(el.requestFullscreen||el.webkitRequestFullscreen)&&matchMedia('(pointer:coarse)').matches)goFull();}}

addEventListener('keydown',e=>{firstInput();keys[e.code]=true;
  if(e.code==='KeyF'&&!e.repeat)goFull();
  if(e.code==='KeyM'&&!e.repeat){save.mute=!save.mute;Snd.vol();store();}
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Backspace'].includes(e.code))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('gamepadconnected',()=>toast('Controller connected'));
addEventListener('gamepaddisconnected',()=>toast('Controller disconnected'));

function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-offX)/scale,y:(e.clientY-r.top-offY)/scale};}
const near=(p,x,y,r)=>(p.x-x)*(p.x-x)+(p.y-y)*(p.y-y)<r*r;
cv.addEventListener('pointerdown',e=>{e.preventDefault();firstInput();const p=toLogical(e);lastP=p;
  if(e.pointerType!=='mouse')usedTouch=true;
  if(state==='play'){
    if(usedTouch){if(near(p,W-54,H-150,42)){touch.bomb=true;return;}if(near(p,54,H-150,38)){touch.special=true;return;}}
    if(near(p,W-26,74,24)){touch.pause=true;return;}
    if(touch.id===null){touch.id=e.pointerId;touch.lx=p.x;touch.ly=p.y;touch.active=true;}
  }else{
    for(const h of hot){if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){h.fn();return;}}
    touch.tapAny=true;}
});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==touch.id)return;const p=toLogical(e);
  touch.dx+=p.x-touch.lx;touch.dy+=p.y-touch.ly;touch.lx=p.x;touch.ly=p.y;});
function endTouch(e){if(e.pointerId===touch.id){touch.id=null;touch.active=false;}}
cv.addEventListener('pointerup',endTouch);cv.addEventListener('pointercancel',endTouch);
for(const ev of['touchstart','touchmove','gesturestart','contextmenu'])
  document.addEventListener(ev,e=>e.preventDefault(),{passive:false});

/* Poll all devices once per frame; tap.* is true only on the frame a control goes down. */
function pollInput(){
  let x=0,y=0,fire=false,bomb=false,sp=false,pause=false,ok=false,back=false,l1=false,r1=false;
  if(keys.ArrowLeft||keys.KeyA)x-=1;if(keys.ArrowRight||keys.KeyD)x+=1;
  if(keys.ArrowUp||keys.KeyW)y-=1;if(keys.ArrowDown||keys.KeyS)y+=1;
  fire=!!(keys.Space||keys.KeyJ);bomb=!!(keys.KeyK||keys.ShiftLeft||keys.ShiftRight);sp=!!(keys.KeyL||keys.KeyX);
  pause=!!(keys.KeyP||keys.Escape);ok=!!(keys.Enter||keys.Space||keys.KeyJ);back=!!(keys.Escape||keys.Backspace);
  l1=!!keys.KeyQ;r1=!!keys.KeyE;
  let pads=[];try{pads=navigator.getGamepads?navigator.getGamepads():[];}catch(e){}
  for(const p of pads){if(!p||!p.buttons)continue;const b=i=>!!(p.buttons[i]&&p.buttons[i].pressed);
    const ax=p.axes[0]||0,ay=p.axes[1]||0;if(Math.hypot(ax,ay)>.2){x+=ax;y+=ay;}
    if(b(14))x-=1;if(b(15))x+=1;if(b(12))y-=1;if(b(13))y+=1;
    fire=fire||b(0)||b(7);bomb=bomb||b(1);sp=sp||b(2);pause=pause||b(9);ok=ok||b(0);back=back||b(1);l1=l1||b(4);r1=r1||b(5);}
  if(touch.active)fire=true;
  bomb=bomb||touch.bomb;sp=sp||touch.special;pause=pause||touch.pause;const any=touch.tapAny;
  touch.bomb=touch.special=touch.pause=touch.tapAny=false;
  const m=Math.hypot(x,y);if(m>1){x/=m;y/=m;}
  const now={up:y<-.5,down:y>.5,left:x<-.5,right:x>.5,ok,back,bomb,special:sp,pause,l1,r1,fire};
  for(const k in now)tap[k]=now[k]&&!prevIn[k];
  tap.any=any||tap.ok;prevIn=now;inp.x=x;inp.y=y;inp.fire=fire;
}

/* Boss variants: faster, darker chords, a more urgent melody. */
(function(){const B=(id,ch,mel,x)=>{TRACKS[id+'b']=Object.assign({},TRACKS[id],{bpm:TRACKS[id].bpm*1.1,chords:ch,mel:MEL(mel),melLen:2},x||{});};
 B('m1',[[0,1],[8,0],[5,1],[7,0]],'0 . 3 . 7 . 3 . 8 . 7 . 3 . 2 . | 0 . 3 . 7 . 12 . 10 . 8 . 7 . . .',{k:'x.x.x...x.x.x...'});
 B('m2',[[0,1],[0,1],[5,1],[7,0]],'0 . 0 . 3 . 0 . 7 . 6 . 5 . 3 . | 0 . 0 . 3 . 0 . 10 . 9 . 8 . 7 .',{k:'x...x...x...x...'});
 B('m3',[[0,1],[1,0],[0,1],[7,0]],'0 . . 0 . . 1 . 0 . . 0 . . 3 . | 0 . . 0 . . 1 . 0 . 7 . 6 . 3 .',{bpm:122,h:'x.x.x.x.x.x.x.x.'});
 B('m4',[[0,0],[0,0],[3,0],[5,0]],'0 . 0 12 . 0 10 . 0 . 0 7 . 5 3 . | 0 . 0 12 . 0 10 . 15 . 12 . 10 . 7 .');
 B('m5',[[0,1],[8,0],[5,1],[7,0]],'12 . 12 . 11 . 12 . 15 . 12 . 11 . 7 . | 12 . 12 . 11 . 12 . 17 . 15 . 14 . 12 .');
 B('m6',[[0,1],[0,1],[1,0],[0,1]],'0 12 0 12 3 12 0 12 7 12 0 12 5 12 3 12 | 0 12 0 12 3 12 0 12 10 . 8 . 7 . 3 .');
 B('m7',[[0,1],[1,0],[0,1],[8,0]],'0 . . 12 . . 0 . . 13 . . 0 . 12 . | 0 . . 12 . . 0 . . 15 . . 13 . 12 .',{bpm:128,k:'x...x...x...x...',h:'x.x.x.x.x.x.x.x.'});
})();

const Snd={ac:null,master:null,mus:null,sfx:null,noise:null,cur:null,engine:null,want:null,wantEng:null,
 init(){
  if(this.ac){if(this.ac.state==='suspended')this.ac.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  let ac;try{ac=new AC();}catch(e){return;}
  this.ac=ac;this.master=ac.createGain();const comp=ac.createDynamicsCompressor();
  this.master.connect(comp);comp.connect(ac.destination);
  this.mus=ac.createGain();this.sfx=ac.createGain();this.mus.connect(this.master);this.sfx.connect(this.master);
  const buf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.noise=buf;
  this.vol();if(this.want){const w=this.want;this.want=null;this.play(w);}
  if(this.wantEng)this.engineOn(this.wantEng);
 },
 vol(){if(!this.ac)return;this.master.gain.value=save.mute?0:1;this.mus.gain.value=save.music*.55;this.sfx.gain.value=save.sfx*.6;},
 suspend(on){if(!this.ac)return;try{on?this.ac.suspend():this.ac.resume();}catch(e){}},
 /* building blocks: an enveloped oscillator and an enveloped filtered noise burst */
 tone(dest,type,f,t,dur,vol,f2,atk){const ac=this.ac,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(f2,1),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+(atk||.006));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.03);},
 nz(dest,t,dur,vol,ftype,freq,q,hard){const ac=this.ac,s=ac.createBufferSource();s.buffer=this.noise;s.loop=true;
  const f=ac.createBiquadFilter();f.type=ftype;f.frequency.value=freq;f.Q.value=q||1;const g=ac.createGain();
  g.gain.setValueAtTime(vol,t);if(hard){g.gain.setValueAtTime(vol,t+dur*.8);g.gain.linearRampToValueAtTime(.0001,t+dur);}
  else g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(dest);s.start(t,Math.random()*.5);s.stop(t+dur+.03);},
 /* sound effects */
 fx(name,a){if(!this.ac||save.mute||this.ac.state!=='running')return;const t=this.ac.currentTime,d=this.sfx;
  switch(name){
   case 'mg':this.nz(d,t,.05,.22,'bandpass',1700,2);this.tone(d,'square',170,t,.04,.07,90);break;
   case 'cannon':this.tone(d,'sawtooth',150,t,.06,.13,70);this.nz(d,t,.05,.13,'lowpass',2600);break;
   case 'missile':this.nz(d,t,.45,.25,'bandpass',900,.8);this.tone(d,'sawtooth',280,t,.4,.05,900);break;
   case 'lock':this.tone(d,'square',1400,t,.06,.06);this.tone(d,'square',1400,t+.09,.06,.06);break;
   case 'boom':{const s=a||1;this.nz(d,t,.3*s,.45,'lowpass',1000/s);this.tone(d,'sine',130/s,t,.28*s,.4,30);break;}
   case 'hit':this.nz(d,t,.04,.1,'highpass',3000);break;
   case 'hurt':this.tone(d,'sawtooth',220,t,.22,.25,60);this.nz(d,t,.15,.3,'lowpass',1500);break;
   case 'power':[523,659,784,1047].forEach((f,i)=>this.tone(d,'triangle',f,t+i*.06,.16,.2));break;
   case 'bomb':this.tone(d,'sine',220,t,1,.6,24);this.nz(d,t,1,.55,'lowpass',600);break;
   case 'siren':for(let i=0;i<3;i++){this.tone(d,'sawtooth',420,t+i*.5,.25,.12,640);this.tone(d,'sawtooth',640,t+i*.5+.25,.25,.12,420);}break;
   case 'ui':this.tone(d,'square',660,t,.05,.07);break;
   case 'ok':this.tone(d,'square',880,t,.08,.09);this.tone(d,'square',1320,t+.07,.1,.09);break;
   case 'medal':[659,784,988,1319,1568].forEach((f,i)=>this.tone(d,'triangle',f,t+i*.09,.3,.18));break;
  }},
 /* looping engine note: prop drone or jet roar */
 engineOn(kind){this.wantEng=kind;this.engineOff(true);if(!this.ac)return;const ac=this.ac,t=ac.currentTime,g=ac.createGain(),nodes=[];
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(kind==='prop'?.06:.1,t+1);g.connect(this.sfx);
  if(kind==='prop'){const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=62;
   const l=ac.createOscillator();l.frequency.value=24;const lg=ac.createGain();lg.gain.value=16;l.connect(lg);lg.connect(o.frequency);
   const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=420;o.connect(f);f.connect(g);o.start();l.start();nodes.push(o,l);}
  else{const s=ac.createBufferSource();s.buffer=this.noise;s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=520;f.Q.value=.5;
   s.connect(f);f.connect(g);s.start();nodes.push(s);}
  this.engine={g,nodes};},
 engineOff(keep){if(!keep)this.wantEng=null;const e=this.engine;if(!e)return;this.engine=null;
  try{const t=this.ac.currentTime;e.g.gain.cancelScheduledValues(t);e.g.gain.setValueAtTime(e.g.gain.value,t);e.g.gain.linearRampToValueAtTime(0,t+.3);e.nodes.forEach(n=>n.stop(t+.4));}catch(_){}},
 /* music: crossfade to a new track */
 play(id){if(this.want===id&&(this.cur||!this.ac))return;this.want=id;if(!this.ac)return;const ac=this.ac,t=ac.currentTime;
  if(this.cur){const o=this.cur;o.g.gain.cancelScheduledValues(t);o.g.gain.setValueAtTime(o.g.gain.value,t);o.g.gain.linearRampToValueAtTime(0,t+1.2);
   setTimeout(()=>{try{o.g.disconnect();}catch(_){}} ,1800);this.cur=null;}
  if(!id||!TRACKS[id])return;const def=TRACKS[id],g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+.8);g.connect(this.mus);
  let lead=g;if(def.fuzz){const ws=ac.createWaveShaper(),c=new Float32Array(256);for(let i=0;i<256;i++){const x=i/128-1;c[i]=Math.tanh(x*6)*.5;}ws.curve=c;ws.connect(g);lead=ws;}
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;lp.connect(lead);
  this.cur={id,def,g,lead:lp,step:-16,next:t+.1};},
 tick(){const c=this.cur;if(!c||!this.ac||this.ac.state!=='running')return;const ac=this.ac,d=c.def,sp=60/d.bpm/4;

  while(c.next<ac.currentTime+.2){const sw=(d.swing&&((c.step&3)===2))?sp*2*d.swing:0;

function drawSpec(c,s){
  const L=s.L,fw=s.fw,col=s.col,dark=shade(col,-.3),lite=shade(col,.18),wc=s.wcol||col;
  const surf=(w,fill)=>{c.fillStyle=fill;
    if(w.ell){c.beginPath();c.ellipse(0,w.y+w.chord/2,w.span/2,w.chord/2,0,0,TAU);c.fill();return;}
    const sw=w.sweep||0,tp=w.tip===undefined?1:w.tip;
    for(const sg of[-1,1]){c.beginPath();c.moveTo(sg*fw*.3,w.y);c.lineTo(sg*w.span/2,w.y+sw);
      c.lineTo(sg*w.span/2,w.y+sw+Math.max(1.5,w.chord*tp));c.lineTo(sg*fw*.3,w.y+w.chord);c.closePath();c.fill();}};
  if(s.tail)surf(s.tail,shade(wc,-.12));
  const main=s.wings[s.wings.length-1];
  for(const w of s.wings)surf(w,w.low?shade(wc,-.28):wc);
  // wing highlight stripe
  c.fillStyle=shade(wc,.14);if(!main.ell){for(const sg of[-1,1]){c.beginPath();c.moveTo(sg*fw*.3,main.y);c.lineTo(sg*main.span/2,main.y+(main.sweep||0));c.lineTo(sg*main.span/2,main.y+(main.sweep||0)+1.2);c.lineTo(sg*fw*.3,main.y+1.6);c.fill();}}
  // engine nacelles
  if(s.eng)for(const x of s.eng){c.fillStyle=dark;c.beginPath();c.ellipse(x,main.y+main.chord*.3,2.6,7,0,0,TAU);c.fill();
    if(s.prop){c.fillStyle='rgba(230,230,230,.35)';c.beginPath();c.ellipse(x,main.y-5,6,1.6,0,0,TAU);c.fill();}}
  // fuselage
  const n=s.nose==='flat'?fw*.42:s.nose==='round'?fw*.3:0,y0=-L/2,y1=L/2;
  const g=c.createLinearGradient(-fw/2,0,fw/2,0);g.addColorStop(0,dark);g.addColorStop(.45,lite);g.addColorStop(1,dark);
  c.fillStyle=g;c.beginPath();c.moveTo(-n,y0);c.lineTo(n,y0);
  c.quadraticCurveTo(fw/2,y0+L*.12,fw/2,y0+L*.32);c.lineTo(fw*.22,y1);c.lineTo(-fw*.22,y1);c.lineTo(-fw/2,y0+L*.32);
  c.quadraticCurveTo(-fw/2,y0+L*.12,-n,y0);c.closePath();c.fill();
  if(s.ncol){c.fillStyle=s.ncol;c.fillRect(-fw/2+.6,y0+L*.06,fw-1.2,L*.09);}
  if(s.fins){c.fillStyle=dark;c.fillRect(-fw*.55,y1-L*.26,1.6,L*.2);c.fillRect(fw*.55-1.6,y1-L*.26,1.6,L*.2);}
  else{c.fillStyle=dark;c.fillRect(-.6,y1-L*.22,1.2,L*.2);}
  if(s.canopy){c.fillStyle='#bfe3ee';c.beginPath();c.ellipse(0,y0+L*.33,fw*.24,L*.09,0,0,TAU);c.fill();
    c.fillStyle='rgba(20,40,60,.55)';c.beginPath();c.ellipse(0,y0+L*.35,fw*.18,L*.06,0,0,TAU);c.fill();}
  if(s.jet){c.fillStyle='#2a2a2e';const w=s.jet>1?fw*.2:0;for(const sg of(s.jet>1?[-1,1]:[0])){c.beginPath();c.arc(sg*w,y1-.5,fw*.2+.6,0,TAU);c.fill();}}
  // national markings on the main wing
  if(s.mark){const mx=main.span*.33,my=main.y+(main.sweep||0)*.66+main.chord*(main.ell?.5:.42),r=Math.min(3.6,main.chord*.3);
    for(const sg of[-1,1]){const x=sg*mx;
      if(s.mark==='cross'){c.fillStyle='#f4f4f4';c.fillRect(x-r,my-r,r*2,r*2);c.fillStyle='#111';c.fillRect(x-r,my-.9,r*2,1.8);c.fillRect(x-.9,my-r,1.8,r*2);}
      else MARKS[s.mark].forEach((k,i,a)=>{c.fillStyle=k;c.beginPath();c.arc(x,my,r*(1-i/a.length),0,TAU);c.fill();});}}

const LEVEL_T=165;   // seconds of flying before the boss

/* ---------- 5. GAME: state, spawning, player ---------- */
const G={p:{x:W/2,y:H-140},era:0,plane:0,score:0,loop:0,wing:0,time:0};
const pb=new Pool(),ebul=new Pool(),parts=new Pool();
let enemies=[],pmsl=[],pups=[],bosses=[],delayed=[],feats=[],clouds=[];

function startLevel(era,fresh,fromCP){
  const e=ERAS[era],p=G.p;G.era=era;G.def=e;G.pd=e.pl[G.plane]||e.pl[0];
  if(fresh){G.score=0;G.lives=3;G.wl=1;G.bombs=3;G.nextLife=50000;G.wing=0;}
  if(fromCP){G.score=0;G.lives=2;G.wl=2;G.bombs=3;G.wing=0;G.nextLife=50000;}
  G.levelStart=G.score;G.t=fromCP?LEVEL_T/2:0;G.cpDone=!!fromCP;
  G.shots=0;G.hits=0;G.kills=0;G.deaths=0;G.phase='fly';G.stage=-1;G.scrollMul=1;G.slow=0;G.shake=0;G.flash=0;
  G.combo=0;G.comboT=0;G.airT=2;G.gndT=3.5;G.airI=0;G.gndI=0;G.fid=0;G.forms={};G.carrier=null;G.viffT=0;G.spCd=0;
  G.bombFx=0;G.groundBoss=false;G.bossName='';G.sv=0;G.msg=null;
  G.zone=0;for(const s of e.sw)if(G.t/LEVEL_T>=s)G.zone++;G.coastY=null;
  Object.assign(p,{x:W/2,y:H-140,hp:100,inv:2.5,shield:0,roll:0,fireT:0,mslT:1,dead:0,bank:0});
  pb.clear();ebul.clear();parts.clear();enemies=[];pmsl=[];pups=[];bosses=[];delayed=[];
  terrainInit();Snd.play(e.music);Snd.engineOn(G.pd.eng);
  setState('play');
  if(fromCP)banner('CHECKPOINT','Back in the fight');else banner(e.name,e.loc+', '+e.year);
}
function banner(a,b){G.msg={a,b,t:3};}
const hpMul=()=>1+G.loop*.3;
const bulSpd=()=>(150+G.era*14)*DIFF[save.diff].bs*(1+G.loop*.1);
function mult(){return Math.min(8,1+(G.combo/4|0));}
function addScore(v){G.score+=v*mult();
  while(G.score>=G.nextLife){G.nextLife+=50000;G.lives++;toast('Extra life');Snd.fx('medal');}}

/* ----- particles ----- */
function part(x,y,vx,vy,life,size,type){if(parts.n>520)return;const q=parts.add();q.x=x;q.y=y;q.vx=vx;q.vy=vy;q.life=q.max=life;q.size=size;q.type=type;}
function boom(x,y,s,quiet){s=s||1;const n=8+s*8|0;
  for(let i=0;i<n;i++){const a=rnd(TAU),v=rnd(30,170)*s;part(x,y,Math.cos(a)*v,Math.sin(a)*v,rnd(.3,.7)*s,rnd(4,9)*s,0);}
  for(let i=0;i<n/2;i++){const a=rnd(TAU),v=rnd(10,60)*s;part(x,y,Math.cos(a)*v,Math.sin(a)*v,rnd(.6,1.3),rnd(7,14)*s,1);}
  if(!quiet)Snd.fx('boom',Math.min(2.2,s));G.shake=Math.max(G.shake,Math.min(14,3*s));}
function spark(x,y){for(let i=0;i<3;i++)part(x,y,rnd(-80,80),rnd(-80,80),.2,2.5,2);}

/* ----- wave spawning ----- */
function spawnEnemy(k,x,y,o){const d=E[k],h=d.hp*(k==='msl'||k==='exocet'?1:hpMul());
  const en=Object.assign({k,d,x,y,x0:x,hp:h,max:h,t:0,move:d.move||'straight',dir:1,ph:rnd(TAU),rot:Math.PI,fireT:rnd(.5,1.8),flash:0,fid:0,st:0,vx:0,vy:0,warn:0,lock:0,ty:0},o||{});
  enemies.push(en);return en;}
function spawnForm(k,form,n){const fid=++G.fid;let cnt=0;const add=(x,y,o)=>{spawnEnemy(k,x,y,Object.assign({fid},o));cnt++;};
  const cx=rnd(100,W-100);
  switch(form){
   case 'vic':for(let i=0;i<n;i++){const r=Math.ceil(i/2),s=i%2?-1:1;add(cx+s*r*38,-30-r*30);}break;
   case 'line':for(let i=0;i<n;i++)add(cx,-30-i*46,{move:'sine',x0:cx,ph:0,t:-i*.42});break;
   case 'finger':for(let i=0;i<n;i++)add(cx+(i-1.5)*40,-30-[20,0,25,45][i%4]);break;
   case 'swoop':{const dir=Math.random()<.5?1:-1;for(let i=0;i<n;i++)add(dir>0?-30-i*46:W+30+i*46,30+i*14,{move:'swoop',dir});}break;
   case 'dive':for(let i=0;i<n;i++)add(60+(W-120)*(i+.5)/n,-30-i*26,{move:'dive'});break;
   case 'heavy':for(let i=0;i<n;i++)add(W*(i+1)/(n+1)+rnd(-30,30),-50,{move:'hover',ty:rnd(110,230)});break;
   case 'swarm':for(let i=0;i<n;i++)add(rnd(30,W-30),-20-i*28);break;
  }
  G.forms[fid]=cnt;}
function spawnWaves(dt){const e=G.def,pr=G.t/LEVEL_T,D=DIFF[save.diff];if(G.t>LEVEL_T-6)return;
  G.airT-=dt;if(G.airT<=0){const w=e.air[G.airI++%e.air.length];spawnForm(w[0],w[1],w[2]+(pr>.6&&w[1]!=='heavy'?1:0));G.airT=lerp(4.3,2.7,pr)*D.rate;}
  G.gndT-=dt;if(G.gndT<=0){G.gndT=lerp(6,4,pr)*D.rate;
    if(G.coastY!==null)return;                      // not while a coastline is crossing the screen
    const water=!!TERR[e.zones[G.zone]].water;
    const ok=e.gnd.filter(g=>(g[2]===undefined||g[2]===G.zone)&&(g[0]==='turret'||!!WATER_UNITS[g[0]]===water));
    if(!ok.length)return;const g=ok[G.gndI++%ok.length],x0=rnd(50,W-50-(g[1]-1)*46),col=Math.random()<.4;
    for(let i=0;i<g[1];i++)spawnEnemy(g[0],col?clamp(x0,40,W-40):x0+i*46,col?-30-i*44:-30-rnd(20));}
}

/* ----- player ----- */
function pbullet(x,y,a,dmg){const b=pb.add();b.x=x;b.y=y;b.vx=Math.sin(a)*640;b.vy=-Math.cos(a)*640;b.dmg=dmg;G.shots++;}
function firePlayer(){const p=G.p,L=G.wl,big=(G.era===1&&L>=3)?1.5:1,y=p.y-16;
  if(L===1){pbullet(p.x-5,y,0,1);pbullet(p.x+5,y,0,1);}
  else if(L===2){pbullet(p.x,y-4,0,big);pbullet(p.x-8,y,0,big);pbullet(p.x+8,y,0,big);}
  else if(L===3){pbullet(p.x-5,y,0,big);pbullet(p.x+5,y,0,big);pbullet(p.x-11,y+4,-.13,big);pbullet(p.x+11,y+4,.13,big);}
  else{pbullet(p.x,y-4,0,big*1.2);pbullet(p.x-8,y,0,big);pbullet(p.x+8,y,0,big);pbullet(p.x-13,y+4,-.17,big);pbullet(p.x+13,y+4,.17,big);}
  for(let i=0;i<G.wing;i++)pbullet(p.x+(i?38:-38),p.y+4,0,1);
  part(p.x,y,0,-40,.05,5,2);
  Snd.fx(big>1?'cannon':G.pd.gun);}
function findTarget(x,y,gndFirst){let best=null,bd=1e9;
  for(const e of enemies){if(e.y<10||e.y>H)continue;let d=(e.x-x)*(e.x-x)+(e.y-y)*(e.y-y);if(gndFirst&&e.d.g)d*=.2;if(e.d.o==='msl')d*=.5;if(d<bd){bd=d;best=e;}}
  if(!best)for(const u of bosses)if(u.y>0&&!u.shield){best=u;break;}
  return best;}
function fireMissiles(){const p=G.p,k=G.pd.msl;if(!k||(k==='rocket'&&G.wl<3))return;
  p.mslT=k==='rocket'?1.1:k==='homing'?1.5:1.2;let tg=null;
  if(k!=='rocket'){tg=findTarget(p.x,p.y,G.pd.gndFirst);if(!tg)return;if(k==='lock'){tg.lock=.8;Snd.fx('lock');}}
  for(const s of[-1,1])pmsl.push({x:p.x+s*13,y:p.y,vx:s*50,vy:-120,tg,dmg:k==='rocket'?4:k==='homing'?5:6,life:2.6,k});
  Snd.fx('missile');}
function useBomb(){if(G.bombs<=0||G.p.dead>0)return;G.bombs--;G.bombFx=1;ebul.clear();G.flash=.5;G.shake=14;Snd.fx('bomb');
  for(const e of enemies){if(e.y<-20)continue;damageEnemy(e,e.d.g?30:(e.d.o==='msl'?99:8));}
  for(const u of bosses)if(!u.shield&&u.y>0){u.hp-=45;u.flash=.15;}}
function useSpecial(){const p=G.p;if(G.spCd>0||p.dead>0)return;
  if(G.pd.viff){G.viffT=2.4;G.spCd=9;banner('VIFF','Enemies overshoot');}
  else{p.roll=.7;G.spCd=4;}
  Snd.fx('ok');}
function hurtPlayer(d,force){const p=G.p;if(p.dead>0)return;
  if(!force){if(p.inv>0||p.roll>0)return;if(p.shield>0){p.shield=Math.max(0,p.shield-1.5);spark(p.x,p.y);Snd.fx('hit');return;}}
  p.hp-=d*DIFF[save.diff].dmg;p.inv=.7;G.shake=10;G.flash=.25;G.combo=0;Snd.fx('hurt');
  if(p.hp<=0){boom(p.x,p.y,2.2);G.lives--;G.deaths++;p.dead=1.8;G.wl=Math.max(1,G.wl-1);G.wing=0;}}
function updatePlayer(dt){const p=G.p,pd=G.pd;
  if(p.dead>0){p.dead-=dt;touch.dx=touch.dy=0;
    if(p.dead<=0){if(G.lives<0){gameOver();return;}Object.assign(p,{x:W/2,y:H-140,hp:100,inv:3,shield:0,roll:0});G.bombs=Math.max(G.bombs,2);}
    return;}
  const sp=pd.spd*(p.roll>0?1.35:1);
  p.x=clamp(p.x+inp.x*sp*dt+touch.dx*save.sens,18,W-18);p.y=clamp(p.y+inp.y*sp*dt+touch.dy*save.sens,64,H-40);
  p.bank=lerp(p.bank,clamp(inp.x+touch.dx*.4,-1,1),Math.min(1,dt*8));touch.dx=touch.dy=0;
  if(p.inv>0)p.inv-=dt;if(p.shield>0)p.shield-=dt;if(p.roll>0)p.roll-=dt;if(G.spCd>0)G.spCd-=dt;if(G.viffT>0)G.viffT-=dt;
  p.fireT-=dt;p.mslT-=dt;
  if(inp.fire){if(p.fireT<=0){p.fireT=pd.rate*(G.wl>=4?.85:1);firePlayer();}if(p.mslT<=0)fireMissiles();}
  if(tap.bomb)useBomb();if(tap.special)useSpecial();
  if(p.hp<35&&Math.random()<dt*14)part(p.x+rnd(-4,4),p.y+10,rnd(-10,10),80,.7,7,1);
  if(pd.eng==='jet'&&Math.random()<dt*30)part(p.x,p.y+20,0,140,.35,3,3);
}

/* ----- enemies ----- */
function ebullet(x,y,a,sp,r){const b=ebul.add();b.x=x;b.y=y;b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp;b.r=r||4;}
const aimAt=(x,y)=>Math.atan2(G.p.y-y,G.p.x-x);
function enemyFire(e,type){const a=aimAt(e.x,e.y),s=bulSpd();
  if(type==='aim')ebullet(e.x,e.y,a,s);
  else if(type==='fwd'){ebullet(e.x-6,e.y+8,Math.PI/2,s*1.1);ebullet(e.x+6,e.y+8,Math.PI/2,s*1.1);}
  else if(type==='fan'){for(let i=-1;i<=1;i++)ebullet(e.x,e.y,a+i*.26,s*.9);}
  else if(type==='msl'){e.warn=.9;Snd.fx('lock');}}
function dropPup(x,y,t){if(!t){const r=Math.random();t=r<.3?(G.wl<4?'W':'$'):r<.44?'B':r<.6?'H':r<.7?'S':r<.78?'M':'$';}
  pups.push({x,y,type:t,t:0});}
function damageEnemy(e,dmg){if(e.hp<=0)return;e.hp-=dmg;e.flash=.08;if(e.hp<=0)killEnemy(e);}
function killEnemy(e){const d=e.d;e.dead=true;G.kills++;G.combo++;G.comboT=2.2;addScore(d.sc);
  boom(e.x,e.y,d.r>20?1.8:d.o==='msl'?.6:1);
  if(e.fid&&G.forms[e.fid]>0&&--G.forms[e.fid]===0&&Math.random()<.5)dropPup(e.x,e.y);
  else if(d.sc>=500&&Math.random()<.5)dropPup(e.x,e.y);
  else if(d.g&&Math.random()<.1)dropPup(e.x,e.y);}
function carrierHit(){const c=G.carrier;if(!c)return;c.hp--;boom(W/2+rnd(-40,40),H-70,2);G.flash=.3;
  if(c.hp<=0){toast('Carrier lost');c.hp=c.max;hurtPlayer(999,true);}else toast('Carrier hit! '+c.hp+' left');}
function updateEnemies(dt){const p=G.p,D=DIFF[save.diff];
  for(let i=enemies.length-1;i>=0;i--){const e=enemies[i],d=e.d;e.t+=dt;if(e.flash>0)e.flash-=dt;if(e.lock>0)e.lock-=dt;
    if(d.g)e.y+=G.sv*dt;
    else switch(e.move){
     case 'straight':e.y+=d.spd*dt;e.x+=Math.sin(e.t*2+e.ph)*24*dt;break;
     case 'sine':e.y+=d.spd*dt;e.x=e.x0+Math.sin(e.t*2.2)*80;break;
     case 'swoop':{const vx=e.dir*d.spd*Math.cos(e.t*.85),vy=d.spd*.55;e.x+=vx*dt;e.y+=vy*dt;e.rot=Math.atan2(vy,vx)+Math.PI/2;break;}
     case 'dive':if(e.st===0){e.y+=d.spd*.7*dt;if(e.y>110){e.st=1;const a=aimAt(e.x,e.y);e.vx=Math.cos(a)*d.spd*2.1;e.vy=Math.sin(a)*d.spd*2.1;e.rot=a+Math.PI/2;}}
       else{e.x+=e.vx*dt;e.y+=e.vy*dt;}break;
     case 'hover':if(e.st===0){e.y+=d.spd*1.6*dt;if(e.y>=e.ty){e.st=1;e.t=0;}}
       else if(e.st===1){e.x+=Math.sin(e.t*.8+e.ph)*30*dt;if(e.t>9)e.st=2;}else e.y+=d.spd*1.5*dt;break;
     case 'chase':{const a=aimAt(e.x,e.y);let cur=e.rot-Math.PI/2;const df=((a-cur+Math.PI*3)%TAU)-Math.PI;
       cur+=clamp(df,-2.1*dt,2.1*dt);e.rot=cur+Math.PI/2;e.x+=Math.cos(cur)*d.spd*dt;e.y+=Math.sin(cur)*d.spd*dt;
       if(d.o==='msl'&&Math.random()<dt*30)part(e.x,e.y,0,0,.4,4,1);
       if(d.ttl&&e.t>d.ttl){boom(e.x,e.y,.6,true);e.dead=true;}break;}
     case 'exo':e.y+=d.spd*dt;e.x+=(W/2-e.x)*.35*dt;if(Math.random()<dt*30)part(e.x,e.y-8,0,0,.4,4,1);
       if(e.y>H-110){carrierHit();e.dead=true;}break;
    }
    if(!e.dead&&d.fire&&e.y>20&&e.y<H*.72&&e.x>0&&e.x<W&&p.dead<=0){
      if(e.warn>0){e.warn-=dt;if(e.warn<=0){spawnEnemy('msl',e.x,e.y,{rot:aimAt(e.x,e.y)+Math.PI/2});Snd.fx('missile');}}
      else{e.fireT-=dt;if(e.fireT<=0){e.fireT=d.fire[1]*D.rate*rnd(.85,1.2);enemyFire(e,d.fire[0]);}}}
    if(!e.dead&&!d.g&&p.dead<=0&&p.inv<=0&&p.roll<=0){const dx=e.x-p.x,dy=e.y-p.y,rr=d.r+11;
      if(dx*dx+dy*dy<rr*rr){hurtPlayer(d.o==='msl'?20:25);damageEnemy(e,6);}}
    if(e.dead||e.y>H+70||e.x<-260||e.x>W+260||e.y<-420){if(!e.dead&&e.fid)G.forms[e.fid]=-1;enemies.splice(i,1);}
  }}

/* ----- hit testing shared by bullets, missiles ----- */
function hitAt(x,y,r,dmg,gmul){
  for(const e of enemies){if(e.dead||e.y<-10)continue;const dx=e.x-x,dy=e.y-y,rr=e.d.r+r;
    if(dx*dx+dy*dy<rr*rr){damageEnemy(e,e.d.g?dmg*gmul:dmg);return true;}}
  for(const u of bosses){if(u.hp<=0||u.y<-u.hh)continue;
    if(Math.abs(x-u.x)<u.hw+r&&Math.abs(y-u.y)<u.hh+r){
      if(u.shield>0)return true;
      for(const t of u.turs){if(!t.alive)continue;const dx=u.x+t.x-x,dy=u.y+t.y-y;
        if(dx*dx+dy*dy<24*24){t.hp-=dmg;if(t.hp<=0){t.alive=false;t.scud=0;boom(u.x+t.x,u.y+t.y,1.4);u.hp-=u.max*.04;addScore(500);}break;}}
      u.hp-=dmg;u.flash=.06;return true;}}
  return false;}
function updateShots(dt,edt){const p=G.p;
  for(let i=pb.n-1;i>=0;i--){const b=pb.a[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<-12||b.x<-10||b.x>W+10){pb.kill(i);continue;}
    if(hitAt(b.x,b.y,4,b.dmg,.5)){G.hits++;spark(b.x,b.y);Snd.fx('hit');pb.kill(i);}}
  for(let i=ebul.n-1;i>=0;i--){const b=ebul.a[i];b.x+=b.vx*edt;b.y+=b.vy*edt;
    if(b.y<-20||b.y>H+20||b.x<-20||b.x>W+20){ebul.kill(i);continue;}
    if(p.dead<=0){const dx=b.x-p.x,dy=b.y-p.y,rr=b.r+(p.shield>0?18:6);
      if(dx*dx+dy*dy<rr*rr&&p.inv<=0&&p.roll<=0){hurtPlayer(b.r>5?18:12);ebul.kill(i);}}}
  for(let i=pmsl.length-1;i>=0;i--){const m=pmsl[i];m.life-=dt;
    const tg=m.tg&&((m.tg.d&&!m.tg.dead)||(m.tg.turs&&m.tg.hp>0))?m.tg:null;
    if(tg){const a=Math.atan2(tg.y-m.y,tg.x-m.x);m.vx=lerp(m.vx,Math.cos(a)*520,Math.min(1,dt*5));m.vy=lerp(m.vy,Math.sin(a)*520,Math.min(1,dt*5));}
    else{m.vx*=1-Math.min(1,dt*4);m.vy=Math.max(-620,m.vy-900*dt);}
    m.x+=m.vx*dt;m.y+=m.vy*dt;if(Math.random()<dt*40)part(m.x,m.y,0,30,.35,4,1);
    if(m.life<=0||m.y<-20||m.y>H+20||m.x<-20||m.x>W+20){pmsl.splice(i,1);continue;}
    if(hitAt(m.x,m.y,7,m.dmg,2)){boom(m.x,m.y,.7,true);pmsl.splice(i,1);}}
  for(let i=pups.length-1;i>=0;i--){const u=pups[i];u.t+=dt;u.y+=70*dt;u.x+=Math.sin(u.t*3)*20*dt;
    if(u.y>H+30){pups.splice(i,1);continue;}
    if(p.dead<=0&&Math.abs(u.x-p.x)<28&&Math.abs(u.y-p.y)<28){pups.splice(i,1);Snd.fx('power');let label='';
      switch(u.type){
       case 'W':if(G.wl<4){G.wl++;label='WEAPON LEVEL '+G.wl;}else{addScore(2000);label='+2000';}break;
       case 'B':G.bombs=Math.min(6,G.bombs+1);label='BOMB';break;
       case 'H':p.hp=Math.min(100,p.hp+40);label='REPAIR';break;
       case 'S':p.shield=8;label='SHIELD';break;
       case 'M':G.wing=Math.min(2,G.wing+1);label=G.era===6?'DRONE WINGMAN':'WINGMAN';break;
       default:addScore(1000);label='MEDAL +1000';}
      toast(label);}}
  for(let i=parts.n-1;i>=0;i--){const q=parts.a[i];q.life-=dt;if(q.life<=0){parts.kill(i);continue;}q.x+=q.vx*dt;q.y+=q.vy*dt+(q.type===1?G.sv*dt*.5:0);}
  for(let i=delayed.length-1;i>=0;i--){const d=delayed[i];d.t-=edt;if(d.t<=0){delayed.splice(i,1);d.fn();}}
}

/* ----- bosses ----- */
function nextStage(){const st=G.def.boss[++G.stage],D=DIFF[save.diff];
  bosses=st.units.map(u=>{const sp=u.s?P[u.s]:null,sc=u.sc||1,h=u.hp*hpMul()*(save.diff===0?.8:1);
    let span=0;if(sp)for(const w of sp.wings)span=Math.max(span,w.span);
    return Object.assign({},u,{hp:h,max:h,x0:u.x,ty:u.y,y:-(u.hh||80)-40,t:0,pi:0,pt:1.5,flash:0,shield:0,tele:0,gx:u.x,gy:u.y,gt:0,
      hw:u.hw||span*sc*.4,hh:u.hh||sp.L*sc*.42,turs:(u.tur||[]).map(t=>({x:t[0],y:t[1],hp:h*.06,alive:true,scud:0}))});});
  G.groundBoss=st.units[0].move==='ground';G.phase='boss';G.bossName=st.name;G.bossMax=bosses.reduce((a,u)=>a+u.max,0);
  G.carrier=st.carrier?{hp:5,max:5}:null;banner('WARNING',st.name);}
function origins(u){const o=u.turs.filter(t=>t.alive).map(t=>({x:u.x+t.x,y:u.y+t.y}));return o.length?o:[{x:u.x,y:u.y+u.hh*.5}];}
function later(t,u,fn){delayed.push({t,fn:()=>{if(u.hp>0)fn();}});}
function doPattern(u,pat){const s=bulSpd(),os=origins(u);
  if(pat.startsWith('esc:')){spawnForm(pat.slice(4),'vic',3);return;}
  switch(pat){
   case 'aim':for(const o of os)for(let i=0;i<3;i++)later(i*.16,u,()=>ebullet(o.x,o.y,aimAt(o.x,o.y),s*1.1));break;
   case 'fan':{const a=aimAt(u.x,u.y);for(let i=-3;i<=3;i++)ebullet(u.x,u.y+u.hh*.4,a+i*.2,s);break;}
   case 'ring':u.tele=.7;later(.7,u,()=>{const o=rnd(TAU);for(let i=0;i<18;i++)ebullet(u.x,u.y,o+i/18*TAU,s*.85);});break;
   case 'spiral':for(let i=0;i<14;i++)later(i*.11,u,()=>{ebullet(u.x,u.y,i*.42+u.t,s*.9);ebullet(u.x,u.y,i*.42+u.t+Math.PI,s*.9);});break;
   case 'bombs':for(const o of os)ebullet(o.x,o.y,Math.PI/2+rnd(-.25,.25),s*.6,7);break;
   case 'msl':os.slice(0,2).forEach(o=>spawnEnemy('msl',o.x,o.y,{rot:aimAt(o.x,o.y)+Math.PI/2}));Snd.fx('missile');break;
   case 'exo':spawnEnemy('exocet',u.x,u.y+20);Snd.fx('missile');toast('Exocet inbound');break;
   case 'scud':{const c=u.turs.filter(t=>t.alive&&t.scud<=0);if(c.length){pick(c).scud=6;Snd.fx('siren');toast('Scud fuelling. Destroy the launcher!');}break;}
   case 'shield':u.shield=4;spawnForm('drone','swarm',6);break;
  }}
function updateBosses(dt){const p=G.p,D=DIFF[save.diff];
  for(let i=bosses.length-1;i>=0;i--){const u=bosses[i];u.t+=dt;if(u.flash>0)u.flash-=dt;if(u.shield>0)u.shield-=dt;if(u.tele>0)u.tele-=dt;
    if(u.y<u.ty&&u.move!=='ace'){u.y=Math.min(u.ty,u.y+110*dt);}
    else{
      if(u.move==='sway'){const amp=Math.max(0,Math.min(70,W/2-u.hw-8));u.x=u.x0+Math.sin(u.t*.6+u.x0)*amp;u.y=u.ty+Math.sin(u.t*.9)*12;}
      else if(u.move==='ace'){u.gt-=dt;if(u.gt<=0){u.gt=1.3;u.gx=rnd(70,W-70);u.gy=rnd(90,330);}u.x=lerp(u.x,u.gx,Math.min(1,dt*2.2));u.y=lerp(u.y,u.gy,Math.min(1,dt*2.2));}
      u.pt-=dt;if(u.pt<=0&&p.dead<=0){u.pt=lerp(1.2,2.4,clamp(u.hp/u.max,0,1))*D.rate;doPattern(u,u.pat[u.pi++%u.pat.length]);}
      for(const t of u.turs)if(t.alive&&t.scud>0){t.scud-=dt;if(t.scud<=0){boom(u.x+t.x,u.y+t.y,1.2);G.flash=.6;toast('Scud launched! Hull damage');hurtPlayer(22,true);}}
      if(u.move!=='ground'&&p.dead<=0&&Math.abs(p.x-u.x)<u.hw*.8&&Math.abs(p.y-u.y)<u.hh*.8)hurtPlayer(30);
    }
    if(u.hp<=0){addScore(Math.round(4000*(G.era+1)*(u.max/G.bossMax)));G.kills++;
      for(let k=0;k<7;k++){const bx=u.x+rnd(-u.hw,u.hw),by=u.y+rnd(-u.hh,u.hh);delayed.push({t:k*.13,fn:()=>boom(bx,by,1.6)});}
      boom(u.x,u.y,2.4);dropPup(u.x,u.y,bosses.length>1?undefined:'H');bosses.splice(i,1);}
  }
  if(!bosses.length){G.slow=1.5;ebul.clear();G.flash=.5;G.groundBoss=false;G.carrier=null;
    for(const e of enemies)if(e.d.o==='msl')e.dead=true;
    if(G.def.boss[G.stage+1]){G.phase='warn';G.warnT=3.2;Snd.fx('siren');}else{G.phase='clear';G.clearT=3.6;banner('TARGET DESTROYED','Sky clear');}}
}

/* ----- per-frame update for the play state ----- */
function update(dt){const e=G.def;
  if(G.slow>0)G.slow-=dt;const wdt=dt*(G.slow>0?.35:1),edt=wdt*(G.viffT>0?.3:1);G.time+=wdt;
  G.scrollMul+=((G.groundBoss?0:1)-G.scrollMul)*Math.min(1,dt*1.5);G.sv=(72+G.era*9)*G.scrollMul;
  terrainUpdate(wdt);
  if(G.phase==='fly'){G.t+=wdt;spawnWaves(wdt);const pr=G.t/LEVEL_T;
    if(!G.cpDone&&pr>=.5){G.cpDone=true;toast('Checkpoint reached');}
    if(e.sw[G.zone]!==undefined&&pr>=e.sw[G.zone]&&G.coastY===null){G.zone++;G.coastY=-60;}
    if(G.t>=LEVEL_T){G.phase='warn';G.warnT=3.5;Snd.fx('siren');Snd.play(e.music+'b');}}
  else if(G.phase==='warn'){G.warnT-=dt;if(G.warnT<=0)nextStage();}
  else if(G.phase==='boss')updateBosses(edt);
  else if(G.phase==='clear'){G.clearT-=dt;if(G.clearT<=0){levelDone();return;}}
  updatePlayer(dt);if(state!=='play')return;
  updateEnemies(edt);updateShots(wdt,edt);
  if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)G.combo=0;}
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*30);if(G.flash>0)G.flash-=dt;if(G.bombFx>0)G.bombFx-=dt*1.4;
  if(G.msg){G.msg.t-=dt;if(G.msg.t<=0)G.msg=null;}
}
function levelDone(){Snd.engineOff();const lvl=G.score-G.levelStart,acc=G.shots?Math.min(100,Math.round(G.hits/G.shots*100)):0;
  const medal=G.deaths===0&&acc>=30?'GOLD':G.deaths<=1&&acc>=18?'SILVER':'BRONZE';
  G.res={lvl,acc,kills:G.kills,medal,era:G.era};
  if(lvl>save.best[G.era])save.best[G.era]=lvl;
  if(!G.endless){save.unlocked=Math.max(save.unlocked,Math.min(7,G.era+2));if(G.era===6)save.done=true;}
  store();Snd.fx('medal');setState('results');}
function gameOver(){Snd.engineOff();Snd.play(null);setState('gameover');}

/* ---------- 6. RENDERING: terrain, clouds ---------- */
function terrainSpawn(y){const r=G.rng,z=TERR[G.def.zones[G.zone]],n=1+(r()*2|0);
  for(let i=0;i<n;i++)feats.push({k:z.kinds[r()*z.kinds.length|0],x:r()*W,y:y+r()*40,s:.7+r()*.8,seed:(r()*1e6)|0,a:r()*TAU});}
function terrainInit(){feats=[];clouds=[];G.rng=srand(G.era*977+13);G.featD=0;
  for(let y=H;y>-200;y-=70)terrainSpawn(y);
  for(let i=0;i<7;i++)clouds.push({x:rnd(W),y:rnd(H),s:rnd(.7,1.6),hi:i%2});}
function terrainUpdate(dt){const d=G.sv*dt;G.featD+=d;
  for(let i=feats.length-1;i>=0;i--){feats[i].y+=d;if(feats[i].y>H+260)feats.splice(i,1);}
  while(G.featD>70){G.featD-=70;terrainSpawn(-200);}
  if(G.coastY!==null){G.coastY+=d;if(G.coastY>H+80)G.coastY=null;}
  for(const c of clouds){c.y+=(c.hi?70:28)*dt+d*.3;if(c.y>H+120){c.y=-120;c.x=rnd(W);c.s=rnd(.7,1.6);}}}
function blob(c,r,rr,n){c.beginPath();for(let i=0;i<n;i++){const a=i/n*TAU,d=rr*(.7+r()*.5);c.lineTo(Math.cos(a)*d,Math.sin(a)*d);}c.closePath();c.fill();}
function drawFeat(f){const c=ctx,r=srand(f.seed),s=f.s;c.save();c.translate(f.x,f.y);
  switch(f.k){
   case 'field':c.rotate((r()-.5)*.5);c.fillStyle=['#7a7040','#5d6a3a','#86753f','#6f7d48'][r()*4|0];c.fillRect(-50*s,-34*s,100*s,68*s);
     c.strokeStyle='rgba(0,0,0,.12)';c.lineWidth=1;for(let i=-3;i<=3;i++){c.beginPath();c.moveTo(-50*s,i*9*s);c.lineTo(50*s,i*9*s);c.stroke();}break;
   case 'crater':c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.arc(0,0,11*s,0,TAU);c.fill();
     c.strokeStyle='rgba(255,255,255,.14)';c.lineWidth=2;c.beginPath();c.arc(0,0,12*s,3.4,5.6);c.stroke();break;
   case 'trench':c.translate(-f.x,0);c.strokeStyle='#3c331d';c.lineWidth=6;c.lineJoin='round';c.beginPath();
     for(let x=-10;x<=W+30;x+=30)c.lineTo(x,(r()-.5)*26);c.stroke();c.strokeStyle='#8a7a4a';c.lineWidth=1.5;c.stroke();break;
   case 'wood':for(let i=0;i<9;i++){c.fillStyle=G.def.zones[0]==='snow'?'#3d4f45':'#2f4526';c.beginPath();c.arc((r()-.5)*60*s,(r()-.5)*50*s,(5+r()*6)*s,0,TAU);c.fill();}break;
   case 'wave':c.strokeStyle='rgba(255,255,255,.22)';c.lineWidth=1.5;for(let i=0;i<3;i++){c.beginPath();c.arc((r()-.5)*90,(r()-.5)*40,10*s,3.6,5.8);c.stroke();}break;
   case 'isle':c.fillStyle='#d9c98f';blob(c,r,38*s,11);c.fillStyle='#5f8246';blob(c,r,27*s,9);break;
   case 'rock':c.fillStyle='rgba(255,255,255,.3)';blob(c,r,36*s,11);c.fillStyle='#6b7379';blob(c,r,30*s,10);c.fillStyle='#4f575d';blob(c,r,17*s,7);break;
   case 'road':c.translate(-f.x,0);c.rotate((r()-.5)*.3);c.fillStyle='rgba(50,46,40,.5)';c.fillRect(-60,-5,W+120,10);break;
   case 'mount':c.fillStyle='#aab4bd';c.beginPath();c.moveTo(-46*s,24*s);c.lineTo(0,-30*s);c.lineTo(46*s,24*s);c.fill();
     c.fillStyle='rgba(60,80,100,.28)';c.beginPath();c.moveTo(0,-30*s);c.lineTo(46*s,24*s);c.lineTo(8*s,24*s);c.fill();
     c.fillStyle='#f8fbfd';c.beginPath();c.moveTo(-17*s,-8*s);c.lineTo(0,-30*s);c.lineTo(15*s,-10*s);c.lineTo(5*s,-4*s);c.lineTo(-5*s,-11*s);c.fill();break;
   case 'friver':case 'river':c.translate(-f.x,0);c.strokeStyle=f.k==='friver'?'#b5d3e4':'#4a7570';c.lineWidth=26*s;c.beginPath();
     for(let x=-40;x<=W+40;x+=40)c.lineTo(x,Math.sin(x*.012+f.a)*40);c.stroke();
     if(f.k==='river'){c.fillStyle='#8a7a5a';c.fillRect(f.x-5,Math.sin(f.x*.012+f.a)*40-22*s,10,44*s);}break;
   case 'canopy':for(let i=0;i<10;i++){c.fillStyle=['#234a21','#2f6230','#1c3d1c'][r()*3|0];c.beginPath();c.arc((r()-.5)*90*s,(r()-.5)*70*s,(9+r()*10)*s,0,TAU);c.fill();}break;
   case 'paddy':c.rotate((r()-.5)*.4);for(let i=0;i<3;i++)for(let j=0;j<4;j++){c.fillStyle=(i+j)%2?'#6f9a45':'#86ad52';c.fillRect(-46+i*31,-46+j*23,29,21);}break;
   case 'fship':c.fillStyle='rgba(255,255,255,.2)';c.fillRect(-4,30,8,30);c.fillStyle='#8a949c';c.beginPath();c.moveTo(0,-38);c.lineTo(9,-20);c.lineTo(9,32);c.lineTo(-9,32);c.lineTo(-9,-20);c.fill();c.fillStyle='#5d666e';c.fillRect(-5,-8,10,18);break;
   case 'dune':c.strokeStyle='rgba(120,90,40,.35)';c.lineWidth=3;for(let i=0;i<3;i++){c.beginPath();c.arc((r()-.5)*40,i*12,50*s,3.5,5.9);c.stroke();}break;
   case 'oil':c.fillStyle='rgba(30,30,30,.22)';c.beginPath();c.ellipse(10,-30,8,22,.3,0,TAU);c.fill();c.fillStyle='#2a2620';c.fillRect(-6,-6,12,12);
     c.fillStyle='#ff8a2a';c.beginPath();c.arc(0,-8,4+Math.sin(G.time*14+f.a)*2,0,TAU);c.fill();break;
   case 'pipe':c.translate(-f.x,0);c.rotate(r()>.5?.22:-.22);c.fillStyle='#8d8468';c.fillRect(-80,-2,W+160,4);break;
   case 'shelter':for(let i=0;i<3;i++){c.fillStyle='#8f8563';c.beginPath();c.ellipse((i-1)*44,0,18,13,0,Math.PI,TAU);c.fill();c.fillStyle='#3a3526';c.fillRect((i-1)*44-10,-2,20,5);}break;
   case 'plat':c.fillStyle='#2a3444';c.fillRect(-22,-22,44,44);c.strokeStyle='#e9b44c';c.lineWidth=1;c.strokeRect(-22,-22,44,44);c.fillStyle=(G.time*2|0)%2?'#ff4444':'#662222';c.fillRect(-3,-3,6,6);break;
   case 'bldg':for(let i=0;i<5;i++){const bx=(r()-.5)*120,by=(r()-.5)*80,bw=16+r()*22,bh=16+r()*26;c.fillStyle='#1d2636';c.fillRect(bx,by,bw,bh);
     c.fillStyle='rgba(255,214,120,.75)';for(let wy=by+3;wy<by+bh-3;wy+=7)for(let wx=bx+3;wx<bx+bw-3;wx+=7)if(r()>.5)c.fillRect(wx,wy,2,2);}break;
  }
  c.restore();}
function drawTerrain(){const c=ctx,zs=G.def.zones;
  if(G.coastY!==null){c.fillStyle=TERR[zs[G.zone-1]].base;c.fillRect(0,0,W,H);c.fillStyle=TERR[zs[G.zone]].base;c.fillRect(0,0,W,G.coastY);
    const water=TERR[zs[G.zone]].water,r=srand(G.zone*31+G.era);       // surf or chalk cliff along the shoreline
    c.fillStyle=G.era===6?'#3a465a':'#f1efe4';c.beginPath();c.moveTo(0,G.coastY-(water?0:10));
    for(let x=0;x<=W;x+=24)c.lineTo(x,G.coastY+(r()-.5)*18);c.lineTo(W,G.coastY+(water?12:-12));c.lineTo(0,G.coastY+(water?12:-12));c.fill();}
  else{c.fillStyle=TERR[zs[G.zone]].base;c.fillRect(0,0,W,H);}
  for(const f of feats)if(f.y>-200&&f.y<H+200)drawFeat(f);}
function drawClouds(hi){const c=ctx;c.fillStyle='rgba('+G.def.cloud+','+(hi?.3:.5)+')';
  for(const k of clouds){if(!!k.hi!==hi)continue;const s=k.s*(hi?1.5:1);
    c.beginPath();c.arc(k.x,k.y,26*s,0,TAU);c.arc(k.x+30*s,k.y+6*s,20*s,0,TAU);c.arc(k.x-28*s,k.y+8*s,18*s,0,TAU);c.arc(k.x+6*s,k.y+16*s,22*s,0,TAU);c.fill();}}

/* ----- bosses ----- */
function drawTurret(x,y,alive,col){const c=ctx;c.save();c.translate(x,y);
  if(!alive){c.fillStyle='rgba(0,0,0,.6)';c.beginPath();c.arc(0,0,9,0,TAU);c.fill();c.restore();return;}
  c.fillStyle='#22262b';c.beginPath();c.arc(0,0,9,0,TAU);c.fill();c.fillStyle=col||'#7d858c';c.beginPath();c.arc(0,0,6,0,TAU);c.fill();
  c.rotate(aimAt(x,y));c.fillStyle='#15181b';c.fillRect(0,-1.5,14,3);c.restore();}
function drawBoss(u){const c=ctx,t=G.time;c.save();
  switch(u.kind){
   case 'spr':c.restore();planeShadow(u.s,u.x,u.y,Math.PI,u.sc);drawPlane(u.s,u.x,u.y,Math.PI,u.sc);
     if(u.flash>0){c.globalCompositeOperation='lighter';c.globalAlpha=.6;drawPlane(u.s,u.x,u.y,Math.PI,u.sc);c.globalAlpha=1;c.globalCompositeOperation='source-over';}
     c.save();break;
   case 'zep':c.fillStyle='rgba(0,0,0,.2)';c.beginPath();c.ellipse(u.x+26,u.y+36,u.hw,u.hh,0,0,TAU);c.fill();
     c.fillStyle='#5d5a4c';c.fillRect(u.x-48,u.y-u.hh+8,96,10);c.fillRect(u.x-4,u.y-u.hh-6,8,40);
     {const g=c.createLinearGradient(u.x-u.hw,0,u.x+u.hw,0);g.addColorStop(0,'#77735f');g.addColorStop(.4,'#c9c3a6');g.addColorStop(1,'#6a6654');c.fillStyle=g;}
     c.beginPath();c.ellipse(u.x,u.y,u.hw,u.hh,0,0,TAU);c.fill();c.strokeStyle='rgba(0,0,0,.18)';c.lineWidth=1;
     for(let i=-4;i<=4;i++){c.beginPath();c.ellipse(u.x,u.y+i*30,u.hw*Math.sqrt(1-(i*30/u.hh)**2),4,0,0,Math.PI);c.stroke();}
     c.fillStyle='#111';c.fillRect(u.x-9,u.y+40,18,5);c.fillRect(u.x-2.5,u.y+34,5,17);break;
   case 'ship':c.fillStyle='rgba(255,255,255,.18)';c.fillRect(u.x-14,u.y-u.hh-60,28,70);
     c.fillStyle='#59626a';c.beginPath();c.moveTo(u.x,u.y+u.hh);c.lineTo(u.x+u.hw,u.y+u.hh-70);c.lineTo(u.x+u.hw,u.y-u.hh+30);c.lineTo(u.x+u.hw*.6,u.y-u.hh);c.lineTo(u.x-u.hw*.6,u.y-u.hh);c.lineTo(u.x-u.hw,u.y-u.hh+30);c.lineTo(u.x-u.hw,u.y+u.hh-70);c.fill();
     c.fillStyle='#8b6f4a';c.fillRect(u.x-u.hw+7,u.y-u.hh+34,u.hw*2-14,u.hh*2-110);c.fillStyle='#454d54';c.fillRect(u.x-16,u.y-42,32,84);c.fillStyle='#2c3238';c.fillRect(u.x-8,u.y-26,16,18);c.fillRect(u.x-8,u.y+6,16,18);break;
   case 'samsite':c.fillStyle='#6a5b3c';c.fillRect(u.x-u.hw,u.y-u.hh,u.hw*2,u.hh*2);c.strokeStyle='#3d3422';c.lineWidth=5;c.strokeRect(u.x-u.hw,u.y-u.hh,u.hw*2,u.hh*2);
     c.strokeStyle='rgba(40,34,22,.6)';c.lineWidth=8;for(const t2 of u.turs){c.beginPath();c.moveTo(u.x,u.y);c.lineTo(u.x+t2.x,u.y+t2.y);c.stroke();}
     c.translate(u.x,u.y);c.rotate(t*1.6);c.fillStyle='#c9cfc4';c.fillRect(-22,-4,44,8);c.fillStyle='#2a2f2a';c.fillRect(-3,-3,6,6);break;
   case 'scudbase':c.fillStyle='#9a9480';c.fillRect(u.x-u.hw,u.y-u.hh,u.hw*2,u.hh*2);c.fillStyle='#7d7868';for(let i=0;i<6;i++)c.fillRect(u.x-u.hw,u.y-u.hh+i*30,u.hw*2,2);
     c.strokeStyle='#e9b44c';c.setLineDash([10,8]);c.lineWidth=2;c.strokeRect(u.x-u.hw+6,u.y-u.hh+6,u.hw*2-12,u.hh*2-12);c.setLineDash([]);
     for(const s of u.turs){if(!s.alive)continue;c.fillStyle='#5a4f33';c.fillRect(u.x+s.x-13,u.y+s.y-34,26,68);c.fillStyle='#e4dfcc';c.fillRect(u.x+s.x-4,u.y+s.y-30,8,48);c.fillStyle='#c22';c.fillRect(u.x+s.x-4,u.y+s.y-30,8,8);
       if(s.scud>0){c.strokeStyle='#ff3b30';c.lineWidth=4;c.beginPath();c.arc(u.x+s.x,u.y+s.y,26,-Math.PI/2,-Math.PI/2+TAU*(1-s.scud/6));c.stroke();
         c.fillStyle='#ff3b30';c.font='bold 16px '+FONT_M;c.textAlign='center';c.fillText(Math.ceil(s.scud),u.x+s.x,u.y+s.y+52);}}break;
   case 'mother':c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(u.x+20,u.y+40,u.hw,u.hh,0,0,TAU);c.fill();
     c.fillStyle='#2b3440';c.beginPath();c.moveTo(u.x,u.y+u.hh);c.lineTo(u.x+u.hw,u.y-10);c.lineTo(u.x+u.hw-10,u.y-u.hh*.6);c.lineTo(u.x+50,u.y-u.hh*.3);c.lineTo(u.x,u.y-u.hh);c.lineTo(u.x-50,u.y-u.hh*.3);c.lineTo(u.x-u.hw+10,u.y-u.hh*.6);c.lineTo(u.x-u.hw,u.y-10);c.fill();
     c.fillStyle='#3d4a5a';c.beginPath();c.moveTo(u.x,u.y+u.hh-10);c.lineTo(u.x+60,u.y);c.lineTo(u.x,u.y-u.hh+12);c.lineTo(u.x-60,u.y);c.fill();
     c.fillStyle='rgba(110,232,255,'+(.5+Math.sin(t*5)*.3)+')';for(let i=-3;i<=3;i++)c.fillRect(u.x+i*42-3,u.y-4+Math.abs(i)*-6,6,3);
     c.beginPath();c.arc(u.x,u.y,9,0,TAU);c.fill();break;
  }
  c.restore();
  if(u.kind!=='scudbase')for(const s of u.turs)drawTurret(u.x+s.x,u.y+s.y,s.alive,u.kind==='mother'?'#6fe8ff':null);
  if(u.kind!=='spr'&&u.flash>0){c.fillStyle='rgba(255,255,255,.14)';c.beginPath();c.ellipse(u.x,u.y,u.hw*.9,u.hh*.9,0,0,TAU);c.fill();}
  if(u.tele>0){c.strokeStyle='rgba(255,80,60,'+(u.tele/.7)+')';c.lineWidth=3;c.beginPath();c.arc(u.x,u.y,(1-u.tele/.7)*60+10,0,TAU);c.stroke();}
  if(u.shield>0){c.strokeStyle='rgba(110,232,255,.8)';c.lineWidth=3;c.fillStyle='rgba(110,232,255,.12)';c.beginPath();c.ellipse(u.x,u.y,u.hw+14,u.hh+18,0,0,TAU);c.fill();c.stroke();}
}

/* ----- the play field ----- */
const PUP_COL={W:'#e9b44c',B:'#e5533d',H:'#4cc36b',S:'#4aa8ff',M:'#d0d4d8',$:'#ffd700'};
function drawGame(){const c=ctx,p=G.p,e=G.def,t=G.time;
  c.save();
  if(G.shake>0&&save.shake)c.translate(rnd(-G.shake,G.shake),rnd(-G.shake,G.shake));
  drawTerrain();
  for(const en of enemies)if(en.d.g){drawObj(en,t);
    if(en.flash>0){c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.arc(en.x,en.y,en.d.r,0,TAU);c.fill();}
    if(en.warn>0){c.strokeStyle='rgba(255,60,50,.9)';c.lineWidth=2;c.beginPath();c.arc(en.x,en.y,14+en.warn*26,0,TAU);c.stroke();}}
  for(const u of bosses)if(u.move==='ground')drawBoss(u);
  if(G.carrier){c.fillStyle='rgba(255,255,255,.2)';c.fillRect(W/2-12,H-10,24,40);c.fillStyle='#7d868e';c.beginPath();c.moveTo(W/2-34,H+10);c.lineTo(W/2-34,H-110);c.lineTo(W/2-18,H-140);c.lineTo(W/2+26,H-140);c.lineTo(W/2+34,H-110);c.lineTo(W/2+34,H+10);c.fill();
    c.strokeStyle='#f4f4f4';c.lineWidth=2;c.setLineDash([8,8]);c.beginPath();c.moveTo(W/2-6,H);c.lineTo(W/2-6,H-130);c.stroke();c.setLineDash([]);c.fillStyle='#4a525a';c.fillRect(W/2+16,H-90,14,40);}
  // shadows on the ground give the aircraft height
  for(const en of enemies)if(en.d.s)planeShadow(en.d.s,en.x,en.y,en.rot,1);
  if(p.dead<=0)planeShadow(G.pd.s,p.x,p.y,0,1);
  drawClouds(false);
  for(const u of pups){c.save();c.translate(u.x,u.y);c.rotate(Math.sin(u.t*3)*.2);c.fillStyle='rgba(0,0,0,.5)';c.fillRect(-12,-12,24,24);c.fillStyle=PUP_COL[u.type];c.fillRect(-10,-10,20,20);
    c.fillStyle='#111';c.font='bold 15px '+FONT_M;c.textAlign='center';c.textBaseline='middle';c.fillText(u.type==='$'?'★':u.type,0,1);c.restore();}
  for(const en of enemies){if(en.d.g)continue;
    if(en.d.s){drawPlane(en.d.s,en.x,en.y,en.rot,1);
      if(en.flash>0){c.globalCompositeOperation='lighter';drawPlane(en.d.s,en.x,en.y,en.rot,1);c.globalCompositeOperation='source-over';}}
    else drawObj(en,t);}
  for(const en of enemies)if(en.lock>0){const s=en.d.r+6;c.strokeStyle=e.hud==='cyan'?'#6fe8ff':'#6dff8a';c.lineWidth=2;c.strokeRect(en.x-s,en.y-s,s*2,s*2);}
  for(const u of bosses)if(u.move!=='ground')drawBoss(u);
  // shots
  c.fillStyle='#fff3b0';for(let i=0;i<pb.n;i++){const b=pb.a[i];c.fillRect(b.x-1.5,b.y-6,3,12);}
  for(const m of pmsl){c.save();c.translate(m.x,m.y);c.rotate(Math.atan2(m.vy,m.vx)+Math.PI/2);c.fillStyle='#f4f4f4';c.fillRect(-2,-7,4,14);c.fillStyle='#ffb347';c.beginPath();c.arc(0,9,3,0,TAU);c.fill();c.restore();}
  // player and wingmen
  if(p.dead<=0&&!(p.inv>0&&((t*14)|0)%2)){
    c.save();c.translate(p.x,p.y);const sx=p.roll>0?Math.cos(p.roll/.7*TAU):1-Math.abs(p.bank)*.22;c.scale(sx||.05,1);
    const s=sprite(G.pd.s);c.drawImage(s.c,-s.size/2,-s.size/2,s.size,s.size);c.restore();
    for(let i=0;i<G.wing;i++)drawPlane(G.era===6?'drone':G.pd.s,p.x+(i?38:-38),p.y+10,0,G.era===6?1:.6);
    if(p.shield>0){c.strokeStyle='rgba(90,180,255,'+(p.shield<2?.4+Math.sin(t*20)*.3:.8)+')';c.lineWidth=2;c.beginPath();c.arc(p.x,p.y,26,0,TAU);c.stroke();}}
  for(let i=0;i<ebul.n;i++){const b=ebul.a[i];c.fillStyle=e.eb;c.beginPath();c.arc(b.x,b.y,b.r+1.5,0,TAU);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(b.x,b.y,b.r*.5,0,TAU);c.fill();}
  for(let i=0;i<parts.n;i++){const q=parts.a[i],k=q.life/q.max;
    if(q.type===0){c.fillStyle=k>.7?'#fff6c8':k>.4?'#ffb02e':k>.2?'#e5533d':'rgba(60,50,45,.7)';c.beginPath();c.arc(q.x,q.y,q.size*(.4+k*.6),0,TAU);c.fill();}
    else if(q.type===1){c.fillStyle='rgba(70,70,70,'+(k*.45)+')';c.beginPath();c.arc(q.x,q.y,q.size*(1.4-k*.6),0,TAU);c.fill();}
    else if(q.type===2){c.fillStyle='#fff';c.fillRect(q.x-q.size/2,q.y-q.size/2,q.size,q.size);}
    else{c.fillStyle='rgba(255,255,255,'+(k*.35)+')';c.fillRect(q.x-1.5,q.y,3,10);}}
  if(G.bombFx>0){const r=(1-G.bombFx)*620;c.strokeStyle=(G.era===3?'rgba(255,140,40,':'rgba(255,255,255,')+G.bombFx+')';c.lineWidth=18*G.bombFx+2;c.beginPath();c.arc(p.x,p.y,r,0,TAU);c.stroke();}
  drawClouds(true);
  if(e.night){const pr=G.t/LEVEL_T,a=clamp(Math.min(pr-e.night[0],e.night[1]-pr)*14,0,1);   // night-vision section
    if(a>0&&G.phase==='fly'){c.globalCompositeOperation='multiply';c.fillStyle='rgba(95,190,115,'+(a*.8)+')';c.fillRect(0,0,W,H);c.globalCompositeOperation='source-over';
      c.fillStyle='rgba(0,0,0,'+(a*.1)+')';for(let y=(t*40%4);y<H;y+=4)c.fillRect(0,y,W,1);}}
  if(G.viffT>0){c.fillStyle='rgba(120,200,255,.1)';c.fillRect(0,0,W,H);}
  if(G.flash>0){c.fillStyle='rgba(255,255,255,'+Math.min(.6,G.flash)+')';c.fillRect(0,0,W,H);}
  c.restore();
  drawHUD();
}

/* ----- HUD, styled per era: brass dials, green phosphor, glass-cockpit cyan ----- */
function hudStyle(){const h=G.def.hud;
  return h==='brass'?{col:'#e9c46a',dim:'#8a7038',font:FONT_S,bg:'rgba(38,26,12,.78)'}:
         h==='green'?{col:'#6dff8a',dim:'#2d7a3c',font:FONT_M,bg:'rgba(4,22,10,.78)'}:{col:'#6fe8ff',dim:'#2a6f80',font:FONT_M,bg:'rgba(6,16,28,.78)'};}
function drawHUD(){const c=ctx,p=G.p,S=hudStyle(),hi=Math.max(save.scores[0]?save.scores[0].s:0,G.score);
  c.textBaseline='alphabetic';
  c.fillStyle=S.bg;c.fillRect(0,0,W,44);c.fillRect(0,H-40,W,40);c.fillStyle=S.dim;c.fillRect(0,44,W,1.5);c.fillRect(0,H-41.5,W,1.5);
  c.font='11px '+S.font;c.fillStyle=S.dim;c.textAlign='left';c.fillText('SCORE',12,15);c.textAlign='center';c.fillText('HIGH',W/2,15);c.textAlign='right';c.fillText('CHAIN',W-12,15);
  c.font='bold 20px '+S.font;c.fillStyle=S.col;c.textAlign='left';c.fillText(String(Math.floor(G.score)).padStart(7,'0'),12,37);
  c.textAlign='center';c.fillText(String(Math.floor(hi)).padStart(7,'0'),W/2,37);c.textAlign='right';c.fillText('x'+mult(),W-12,37);
  // lives
  for(let i=0;i<Math.max(0,G.lives);i++)drawPlane(G.pd.s,22+i*24,H-20,0,.55);
  // hull: a dial for the brass eras, a segmented bar otherwise
  const hp=clamp(p.hp/100,0,1),hc=hp<.3?'#ff4b3a':S.col;
  if(G.def.hud==='brass'){const x=140,y=H-12;c.strokeStyle=S.dim;c.lineWidth=5;c.beginPath();c.arc(x,y,20,Math.PI,TAU);c.stroke();
    c.strokeStyle=hc;c.beginPath();c.arc(x,y,20,Math.PI,Math.PI+Math.PI*hp);c.stroke();
    c.lineWidth=2;c.strokeStyle='#f4ead0';c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(Math.PI+Math.PI*hp)*17,y+Math.sin(Math.PI+Math.PI*hp)*17);c.stroke();

function txt(s,x,y,font,col,al){ctx.font=font;ctx.fillStyle=col||INK;ctx.textAlign=al||'center';ctx.fillText(s,x,y);}
function spaced(s,x,y,font,col,gap){ctx.font=font;ctx.fillStyle=col;ctx.textAlign='left';let w=0;for(const ch of s)w+=ctx.measureText(ch).width+gap;let cx=x-(w-gap)/2;
  for(const ch of s){ctx.fillText(ch,cx,y);cx+=ctx.measureText(ch).width+gap;}}
function wrap(s,x,y,maxW,lh,font,col){ctx.font=font;ctx.fillStyle=col;ctx.textAlign='left';let line='';
  for(const w of s.split(' ')){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,y);y+=lh;line=w;}else line=t;}
  if(line){ctx.fillText(line,x,y);y+=lh;}return y;}

    save.scores.sort((a,b)=>b.s-a.s);save.scores.length=Math.min(10,save.scores.length);store();Snd.fx('medal');setState('scores');};
  const ch=d=>{initials[iniPos]=(initials[iniPos]+d+26)%26;Snd.fx('ui');};
  if(tap.up)ch(1);if(tap.down)ch(-1);if(tap.left&&iniPos>0)iniPos--;
  if(tap.right||tap.ok){if(iniPos<2){iniPos++;Snd.fx('ui');}else if(tap.ok){done();return;}}
  for(let i=0;i<3;i++){const x=W/2+(i-1)*90,sel=i===iniPos;
    button('▲',x-30,300,60,40,()=>{iniPos=i;ch(1);},false);button('▼',x-30,450,60,40,()=>{iniPos=i;ch(-1);},false);
    ctx.fillStyle='rgba(16,24,36,.85)';ctx.fillRect(x-34,350,68,90);ctx.strokeStyle=sel?ACC:'#3b4a5c';ctx.lineWidth=sel?3:1;ctx.strokeRect(x-33.5,350.5,67,89);
    txt(String.fromCharCode(65+initials[i]),x,418,'64px '+FONT_D,sel?ACC:INK);}
  button('OK',W/2-80,530,160,48,done,iniPos===2);},
 scores(dt){skyBG(dt,false);txt('HIGH SCORES',W/2,120,'48px '+FONT_D,ACC);
  if(!save.scores.length)txt('No scores yet. Go and set one.',W/2,300,'14px '+FONT_M,DIMC);
  save.scores.forEach((s,i)=>{const y=190+i*44;txt(String(i+1).padStart(2,' '),70,y,'16px '+FONT_M,DIMC,'left');txt(s.n,120,y,'bold 22px '+FONT_M,i===0?ACC:INK,'left');
    txt('ERA '+s.e,250,y,'12px '+FONT_M,DIMC,'left');txt(String(s.s),W-70,y,'bold 20px '+FONT_M,i===0?ACC:INK,'right');ctx.fillStyle='#3b4a5c';ctx.fillRect(70,y+12,W-140,1);});
  button('BACK',W/2-80,H-110,160,44,()=>setState('main'),true);
  if(stT>.4&&(tap.ok||tap.back))setState('main');},
});

/* ----- main loop ----- */
let lastTs=0;
function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.034,Math.max(0,(ts-lastTs)/1000)||0);lastTs=ts;
  pollInput();hot=[];stT+=dt;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#05080c';ctx.fillRect(0,0,VW,VH);
  ctx.save();ctx.translate(offX,offY);ctx.scale(scale,scale);ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  ctx.textBaseline='alphabetic';ctx.globalAlpha=1;
  SCREENS[state](dt);drawToasts(dt);
  ctx.restore();
  if(offX>1){ctx.fillStyle='#1c2836';ctx.fillRect(offX-2,0,2,VH);ctx.fillRect(offX+W*scale,0,2,VH);}
  if(state!=='pause')Snd.tick();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseGame();Snd.suspend(true);}else Snd.suspend(false);});
addEventListener('blur',()=>{pauseGame();for(const k in keys)keys[k]=false;});
resize();setState('title');requestAnimationFrame(frame);
</script>
